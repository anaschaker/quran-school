services:
  app:
    build: .
    container_name: quran-school
    restart: unless-stopped
    # كل المتغيرات (AUTH_SECRET، SMTP، واتساب...) تُقرأ من .env
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "file:/data/dev.db"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
      BACKUP_DIR: "/backups"
      BACKUP_RETENTION: "14"
      TZ: "${TZ:-Asia/Beirut}"
    # لا نكشف المنفذ للإنترنت مباشرة؛ Nginx على الخادم يمرّر إليه.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - quran-data:/data
      - quran-backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  quran-data:
  quran-backups:
