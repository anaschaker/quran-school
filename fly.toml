# fly.toml — مدرسة القرآن الكريم
app = "quran-school"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[mounts]]
  source = "quran_data"
  destination = "/data"

[[mounts]]
  source = "quran_backups"
  destination = "/backups"

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/dev.db"
  BACKUP_DIR = "/backups"
  BACKUP_RETENTION = "14"
  TZ = "Asia/Beirut"
